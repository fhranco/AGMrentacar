<!-- Encabezado unificado para páginas internas SEO de AGM Rent a Car -->
<!-- Fuentes corporativas + Material Symbols — precargadas para páginas internas -->
<link rel="preload" href="{{ROOT}}assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{{ROOT}}assets/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="{{ROOT}}assets/fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("{{ROOT}}assets/fonts/inter-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Plus Jakarta Sans';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url("{{ROOT}}assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: 400;
    font-display: block;
    src: url("{{ROOT}}assets/fonts/material-symbols-outlined.woff2") format("woff2");
  }
  .material-symbols-outlined {
    font-family: 'Material Symbols Outlined';
    font-weight: normal;
    font-style: normal;
    font-size: 24px;
    line-height: 1;
    letter-spacing: normal;
    text-transform: none;
    display: inline-block;
    white-space: nowrap;
    word-wrap: normal;
    direction: ltr;
    -webkit-font-feature-settings: 'liga';
    font-feature-settings: 'liga';
    -webkit-font-smoothing: antialiased;
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
<header class="fixed top-0 left-0 right-0 z-50 bg-surface-white/95 backdrop-blur-md shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
  <!-- Topbar informativa -->
  <div class="bg-brand-blue-dark text-white/80 font-label-sm text-label-sm py-1.5">
    <div class="max-w-[1280px] mx-auto px-margin-sm lg:px-margin-lg flex flex-wrap items-center justify-between gap-y-1">
      <div class="flex items-center gap-space-md">
        <div class="flex items-center gap-space-xs text-brand-lime">
          <span class="material-symbols-outlined text-[15px]">call</span>
          <a class="text-slate-200 hover:text-brand-lime transition-colors" href="tel:+56966571218">+56 9 6657 1218</a>
          <span class="text-slate-500">/</span>
          <a class="text-slate-200 hover:text-brand-lime transition-colors" href="tel:+56966571211">+56 9 6657 1211</a>
        </div>
        <span class="hidden sm:inline text-slate-700">|</span>
        <a class="hidden sm:flex items-center gap-space-xs hover:text-brand-lime transition-colors" href="mailto:reservas@agmrentacar.cl">
          <span class="text-slate-300">reservas@agmrentacar.cl</span>
        </a>
        <span class="hidden md:inline text-slate-700">|</span>
        <div class="hidden md:flex items-center gap-space-xs text-brand-lime">
          <span class="material-symbols-outlined text-[15px]">chat</span>
          <span class="text-slate-200">WhatsApp:</span>
          <a class="text-slate-200 hover:text-brand-lime transition-colors" href="https://api.whatsapp.com/send?phone=56966571218" target="_blank" rel="noopener noreferrer">1218</a>
          <span class="text-slate-500">/</span>
          <a class="text-slate-200 hover:text-brand-lime transition-colors" href="https://api.whatsapp.com/send?phone=56966571211" target="_blank" rel="noopener noreferrer">1211</a>
        </div>
      </div>
      <div class="flex items-center gap-space-md">
        <div class="hidden md:flex items-center gap-space-xs text-slate-100">
          <span class="w-2 h-2 rounded-full bg-brand-lime"></span>
          <span>Chile (CLP $)</span>
        </div>
        <span class="hidden md:inline text-slate-700">|</span>
        <!-- Selector de idioma -->
        <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white/10 border border-white/15 font-label-sm text-label-sm" id="headerLangSwitcher">
          <button class="px-1.5 py-0.5 rounded text-brand-lime font-bold hover:bg-white/10 transition-colors cursor-pointer" data-lang="es" title="Español" type="button">ES</button>
          <span class="text-white/30 text-[10px]">/</span>
          <button class="px-1.5 py-0.5 rounded text-slate-300 hover:text-surface-white font-medium hover:bg-white/10 transition-colors cursor-pointer" data-lang="en" title="English" type="button">EN</button>
          <span class="text-white/30 text-[10px]">/</span>
          <button class="px-1.5 py-0.5 rounded text-slate-300 hover:text-surface-white font-medium hover:bg-white/10 transition-colors cursor-pointer" data-lang="pt" title="Português" type="button">PT</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Barra de navegación principal interna -->
  <div class="h-20 max-w-[1280px] mx-auto px-margin-sm lg:px-margin-lg flex items-center justify-between gap-4">
    <!-- Logo AGM -->
    <a class="flex items-center gap-space-sm rounded-xl bg-slate-950 px-3 py-2 shrink-0 transition-opacity hover:opacity-90" href="https://agmrentacar.cl/" aria-label="Ir a la página principal de AGM Rent a Car">
      <img alt="AGM Rent a Car" class="h-9 w-auto object-contain" src="{{ROOT}}assets/images/logo-agm.png" width="135" height="69" decoding="async" />
    </a>

    <!-- Navegación central (Desktop) -->
    <nav class="hidden md:flex items-center gap-8" aria-label="Navegación principal">
      <a class="text-slate-700 hover:text-slate-950 font-label-md text-label-md font-semibold transition-colors py-2" href="https://agmrentacar.cl/" data-i18n="nav_home">Inicio</a>
      <a class="text-slate-700 hover:text-slate-950 font-label-md text-label-md font-semibold transition-colors py-2" href="https://agmrentacar.cl/#contacto" data-i18n="nav_contact">Contacto</a>
    </nav>

    <!-- Acciones (CTA principal + navegación compacta móvil) -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Navegación móvil simplificada -->
      <nav class="flex md:hidden items-center gap-1 sm:gap-2" aria-label="Navegación móvil">
        <a class="px-2.5 py-1.5 rounded-lg text-slate-700 hover:text-slate-950 hover:bg-slate-100 font-label-sm text-label-sm font-semibold transition-colors" href="https://agmrentacar.cl/" data-i18n="nav_home">Inicio</a>
        <a class="px-2.5 py-1.5 rounded-lg text-slate-700 hover:text-slate-950 hover:bg-slate-100 font-label-sm text-label-sm font-semibold transition-colors" href="https://agmrentacar.cl/#contacto" data-i18n="nav_contact">Contacto</a>
      </nav>

      <!-- Botón CTA destacado -->
      <a class="inline-flex items-center gap-1.5 px-3.5 sm:px-5 py-2 sm:py-2.5 rounded-xl bg-brand-lime hover:bg-brand-lime-hover text-slate-950 font-label-md text-label-md font-bold shadow-sm transition-all cursor-pointer whitespace-nowrap" href="https://agmrentacar.cl/#cotizador">
        <span class="material-symbols-outlined text-[18px] sm:text-[20px] text-slate-900">request_quote</span>
        <span data-i18n="btn_request_quote">Solicitar cotización</span>
      </a>
    </div>
  </div>
</header>
