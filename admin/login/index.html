<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso Administrativo | AGM Rent a Car</title>
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-header">
          <div class="admin-nav-badge">AGM Rent a Car</div>
          <h1 class="login-title">Panel Administrativo</h1>
          <p class="login-subtitle">
            Ingreso exclusivo para personal autorizado de AGM.
          </p>
        </div>

        <div id="loginErrorAlert" class="alert alert-danger" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="loginEmail" class="form-label">Correo electrónico</label>
            <input
              type="email"
              id="loginEmail"
              class="form-input"
              placeholder="operaciones@agmrentacar.cl"
              required
              autocomplete="username"
            />
          </div>

          <div class="form-group">
            <label for="loginPassword" class="form-label">Contraseña</label>
            <input
              type="password"
              id="loginPassword"
              class="form-input"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>

          <button
            type="submit"
            id="loginSubmitBtn"
            class="btn btn-primary btn-full"
          >
            Iniciar sesión
          </button>
        </form>
      </div>
    </div>

    <script src="../vendor/supabase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/login.js" defer></script>
  </body>
</html>
